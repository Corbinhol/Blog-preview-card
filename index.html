<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-amber-200 flex justify-center items-center flex-col h-screen">
  <main class="w-sm bg-white px-5 py-5 rounded-2xl">
    <img src=".\assets\images\illustration-article.svg" alt="Blog preview card" class="w-full mb-5 rounded-2xl">
    <p class="bg-amber-300 text-gray-900 w-fit px-2 py-1.5 rounded font-bold">Learning</p>
    <h2 class="text-gray-800 font-semibold mt-1">Published 21 Dec 2023</h2>
    <h1 class="text-gray-800 font-bold text-2xl my-3">HTML & CSS foundations</h1>
    <p class="text-gray-800 my-2">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <div class="flex items-center gap-1 mt-8">
      <img src=".\assets\images\image-avatar.webp" alt="image of greg hooper" class="w-8 rounded-full">
      <p class="text-gray-800 font-bold">Greg Hooper</p>
    </div>
    
  </main>
  <div class="attribution absolute bottom-3 w-screen">
    <p class="text-center text-base text-gray-900 font-semibold">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.<br>
      Coded by <a href="#">Corbin Holcombe</a>.
    </p>
  </div>
</body>
</html>
